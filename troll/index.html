<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LOL - xjam.uk</title>
        <link rel="icon" href="../jam.png">
        <link rel="stylesheet" href="../styles.css">
        <style>
            body{
            display:flex;
            justify-content:center;
            align-items:center;
            }
            .big{
            width:350px;
            height:350px;
            object-fit:contain;
            animation:
            float 3s ease-in-out infinite,
            spin 8s linear infinite;
            filter:
            drop-shadow(0 0 40px #008cff);
            }
            .troll{
            position:absolute;
            width:50px;
            height:50px;
            pointer-events:none;
            animation:
            fly 3s ease-out forwards;
            }
            @keyframes float{
            50%{
            transform:translateY(-20px);
            }
            }
            @keyframes spin{
            from{
            rotate:0deg;
            }
            to{
            rotate:360deg;
            }
            }
            @keyframes fly{
            from{
            opacity:1;
            transform:
            translateY(0)
            scale(1);
            }
            to{
            opacity:0;
            transform:
            translateY(-250px)
            scale(.3)
            rotate(360deg);
            }
            }
        </style>
    </head>
    <body>
        <img class="big" src="../troll.png">
        <script>
            function spawn(x,y){
                const img=document.createElement("img");
                img.src="troll.png";
                img.className="troll";
                img.style.left=
                x-25+"px";
                img.style.top=
                y-25+"px";
                img.style.width=
                (30+Math.random()*60)+"px";
                img.style.height=
                img.style.width;
                document.body.appendChild(img);
                setTimeout(()=>{
                    img.remove();
                },3000);
            }
            document.addEventListener(
            "pointermove",
            e=>{
                if(Math.random()<0.25){
                    spawn(
                        e.clientX,
                        e.clientY
                    );
                }
            });
            for(let i=0;i<20;i++){
                spawn(
                    Math.random()*innerWidth,
                    Math.random()*innerHeight
                );
            }
        </script>
    </body>
</html>
